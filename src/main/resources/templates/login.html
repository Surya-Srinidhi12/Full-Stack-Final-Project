<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login - Job Portal')}"></head>
<body>

<nav th:replace="~{fragments :: navbarGuest}"></nav>

<div class="main-content">
    <div class="auth-container glass-card">
        <h2 style="margin-bottom: 2rem; text-align: center;">Welcome Back</h2>
        
        <div th:if="${param.error}" class="badge badge-red" style="display: block; margin-bottom: 1rem; padding: 0.5rem;">
            Invalid email or password.
        </div>
        <div th:if="${param.logout}" class="badge badge-green" style="display: block; margin-bottom: 1rem; padding: 0.5rem;">
            You have been logged out.
        </div>
        <div th:if="${success}" class="badge badge-green" style="display: block; margin-bottom: 1rem; padding: 0.5rem;" th:text="${success}">
        </div>

        <form th:action="@{/loginProcess}" method="post">
            <div class="form-group">
                <label class="form-label" for="username">Email Address</label>
                <input type="email" id="username" name="username" class="form-control" placeholder="john@example.com" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>
        
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
            Don't have an account? <a href="/register">Sign up here</a>
        </p>
    </div>
</div>

</body>
</html>
